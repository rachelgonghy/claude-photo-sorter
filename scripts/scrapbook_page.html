<meta charset="utf-8">
<title>Our Scrapbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800&display=swap">
<style>
/* LAYOUT: a dark, photo-first book. The cover and every chapter open on a full-bleed photograph with the
   name in huge capitals across the top and a short bold line at the bottom left. Chapters and places are
   big rounded photo cards, each named in capitals with one small line under it. One dark world by choice:
   the photographs carry all the colour. Made by scripts/scrapbook.py (claude-photo-sorter). */
:root{
  --bg:#0b0b0d; --card:#151518; --fg:#f6f6f7; --fg2:#a2a2a8; --dim:#56565c; --rule:#26262b; --pill:#f6f6f7; --pillInk:#0b0b0d;
  --shade:rgba(5,5,7,.55); --scrim:rgba(8,8,10,.97);
  --sans:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
img{display:block;width:100%;height:auto;background:var(--card)}
.small{font:500 13px/1.4 var(--sans);color:var(--fg)}
.small.mute{color:var(--fg2)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:64px}
.bar .name{font:800 17px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;min-height:40px;padding:0 20px;border-radius:999px;background:var(--pill);color:var(--pillInk);font:700 14px/1 var(--sans);white-space:nowrap}
.pill:hover{opacity:.88}

/* opening photograph with the name across it */
.hero{position:relative;overflow:hidden;background:var(--card)}
.hero img{height:min(88vh,940px);object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--shade),transparent 34%,transparent 52%,var(--shade) 86%,var(--bg));pointer-events:none}
.hero .top,.hero .bottom{position:absolute;left:0;right:0;z-index:1}
.hero .top{top:clamp(16px,3vw,40px)}
.hero .bottom{bottom:clamp(24px,4vw,56px)}
.hero h1{font:800 clamp(56px,11.5vw,196px)/.84 var(--sans);letter-spacing:-.045em;text-transform:uppercase;margin:0;text-wrap:balance}
.hero .line{font:700 clamp(28px,4vw,60px)/1.02 var(--sans);letter-spacing:-.03em;margin:12px 0 0;max-width:20ch;text-wrap:balance}
.hero .bottom .small{display:block}
@media (max-width:760px){.hero img{height:auto;aspect-ratio:3/4}.hero .line{font-size:clamp(22px,6vw,32px)}}

/* statement: first part bright, the rest dim */
.statement{font:700 clamp(30px,4.6vw,68px)/1.08 var(--sans);letter-spacing:-.035em;margin:0;padding-block:clamp(56px,9vw,140px);max-width:22ch;text-wrap:balance}
.statement span{color:var(--dim)}
h2.center{font:700 clamp(30px,3.8vw,52px)/1.05 var(--sans);letter-spacing:-.03em;text-align:center;margin:0 0 clamp(24px,3vw,40px)}

/* big photo cards: chapters, places, next chapter */
.cards{display:flex;flex-direction:column;gap:16px;padding-bottom:clamp(56px,8vw,120px)}
.card{position:relative;display:block;width:100%;border-radius:16px;overflow:hidden;background:var(--card);text-align:center}
.card img{aspect-ratio:16/8;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.025)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,var(--shade),transparent 45%);pointer-events:none}
.card .label{position:absolute;inset:clamp(20px,3vw,44px) 16px auto;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.card b{font:800 clamp(40px,7.4vw,124px)/.88 var(--sans);letter-spacing:-.045em;text-transform:uppercase;text-wrap:balance}
@media (max-width:760px){.card img{aspect-ratio:4/5}}
@media (prefers-reduced-motion:reduce){.card img{transition:none}}

/* chapter: places */
section.place{padding-block:clamp(56px,8vw,120px) 0;scroll-margin-top:72px}
section.place>header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;margin-bottom:clamp(24px,3vw,40px)}
section.place h2{font:800 clamp(44px,7vw,112px)/.86 var(--sans);letter-spacing:-.045em;text-transform:uppercase;margin:0}
section.place .blurb{font:700 clamp(24px,2.8vw,40px)/1.1 var(--sans);letter-spacing:-.025em;margin:0 0 clamp(32px,4vw,56px);max-width:26ch;text-wrap:balance}
.rows{display:flex;flex-direction:column;gap:clamp(16px,2vw,24px)}
.row{display:flex;gap:clamp(16px,2vw,24px);align-items:flex-start}
.row>figure{margin:0;min-width:0}
.row.one>figure{width:100%}
.row.right{justify-content:flex-end}
.row.right>figure{width:min(100%,66%)}
.row.left>figure{width:min(100%,66%)}
.row.tall>figure{width:min(100%,46%)}
figure button{display:block;width:100%;border-radius:12px;overflow:hidden}
figure button img,figure button video{transition:opacity .3s ease}
figure button video{display:block;width:100%;height:auto;background:var(--card)}
figure .play{position:absolute;left:12px;bottom:12px;font:700 12px/1 var(--sans);background:var(--shade);color:var(--fg);padding:6px 10px;border-radius:999px}
figure button{position:relative}
figure button:hover img{opacity:.9}
figcaption{display:flex;justify-content:space-between;gap:16px;padding-top:10px;font:500 14px/1.4 var(--sans)}
figcaption span:last-child{color:var(--fg2);white-space:nowrap}
@media (max-width:600px){.row{flex-direction:column}.row>figure{width:100%!important;flex:none!important}}
.next{padding-block:clamp(72px,10vw,140px) clamp(56px,8vw,120px)}
.next>.small{display:block;text-align:center;margin-bottom:16px}
footer.made{padding-block:0 56px;text-align:center}
.empty{padding-block:140px;max-width:20ch}
.empty h1{font:800 clamp(56px,9vw,120px)/.86 var(--sans);letter-spacing:-.045em;text-transform:uppercase;margin:16px 0}
.empty p{color:var(--fg2);max-width:44ch}
@media (prefers-reduced-motion:no-preference){main{animation:in .5s ease both}@keyframes in{from{opacity:.0001}to{opacity:1}}}

/* full-size view */
.lb{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px;padding:calc(16px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.lb .top,.lb .foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.lb img,.lb video{max-width:100%;max-height:100%;width:auto;height:auto;margin:auto;object-fit:contain;min-height:0;background:transparent;border-radius:8px}
.lb .foot span{font:500 16px/1.4 var(--sans)}
.lb .ctl{display:flex;gap:8px}
.lb .ctl button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);font:700 14px/1 var(--sans)}
.lb .ctl button:hover{border-color:var(--fg2)}
.lb button:disabled{opacity:.3;cursor:default}
</style>

<div class="bar" id="bar"><div class="wrap"><a class="name" href="#" id="barName">Our Scrapbook</a><a class="pill" href="#" id="toContents">Contents</a></div></div>
<main id="app"><div class="wrap empty"><span class="small mute">Opening</span><h1>Our Scrapbook</h1><p>Loading the photos…</p></div></main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="top"><span class="small mute" id="lbCount"></span><div class="ctl"><button id="lbClose">Close</button></div></div>
  <img id="lbImg" alt=""><video id="lbVid" controls playsinline hidden></video>
  <div class="foot"><span id="lbCap"></span><div class="ctl"><button id="lbPrev">← Previous</button><button id="lbNext">Next →</button></div></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const two = n => String(n).padStart(2, "0");
let B = null, lbList = [], lbAt = 0, lastFocus = null;

const card = (href, src, title, line, attrs = "") => `<${href ? `a href="${href}"` : "button"} class="card" ${attrs}><img src="${esc(src)}" alt="" loading="lazy"><span class="label"><b>${esc(title)}</b><span class="small">${line}</span></span></${href ? "a" : "button"}>`;
const chapterLine = c => { const n = c.pages.reduce((s, p) => s + p.photos.length, 0);
  return [esc(c.dates || c.when), c.places && c.places.length > 1 ? c.places.map(esc).join(" · ") : "", `${n} photos`].filter(Boolean).join("&nbsp;&nbsp;|&nbsp;&nbsp;"); };

function contents() {
  document.title = B.title || "Our Scrapbook";
  $("toContents").hidden = true;
  const cover = B.cover || (B.chapters.find(c => c.kind === "trip") || B.chapters[0] || {}).cover;
  const shelf = (label, kind) => {
    const cs = B.chapters.filter(c => c.kind === kind);
    return cs.length ? `<h2 class="center">${label}</h2><div class="cards">${cs.map(c => card(`#c-${esc(c.id)}`, c.cover, c.title, chapterLine(c))).join("")}</div>` : "";
  };
  $("app").innerHTML = `<div class="hero">${cover ? `<img src="${esc(cover)}" alt="">` : ""}<div class="top wrap"><h1>${esc(B.title || "Our Scrapbook")}</h1></div>`
    + `<div class="bottom wrap"><span class="small">${esc(B.span || "")}</span>${B.subtitle ? `<p class="line">${esc(B.subtitle)}</p>` : ""}</div></div>`
    + `<div class="wrap">${B.lead ? `<p class="statement">${esc(B.lead)} <span>${esc(B.rest || "")}</span></p>` : ""}`
    + shelf("Trips", "trip") + shelf("At home", "year")
    + `<footer class="made small mute">${esc(B.note || "")}</footer></div>`;
}

/* photos: a full-width single, matched-height pairs, and singles set to one side */
function rows(photos, start) {
  const out = []; let i = 0, step = 0;
  const media = p => p.type === "video"
    ? `<video data-src="${esc(p.src)}" poster="${esc(p.poster)}" muted loop playsinline preload="none" width="${p.w}" height="${p.h}"></video><span class="play">▶ Video</span>`
    : `<img src="${esc(p.src)}" alt="${esc(p.caption || "")}" loading="lazy" width="${p.w}" height="${p.h}">`;
  const fig = (p, k, flex) => `<figure${flex ? ` style="flex:${(p.w / p.h).toFixed(3)} 1 0"` : ""}><button data-k="${start + k}" aria-label="Open ${esc(p.caption || (p.type === "video" ? "video" : "photo"))}">${media(p)}</button>${p.caption || p.date ? `<figcaption><span>${esc(p.caption || "")}</span><span>${esc(p.date || "")}</span></figcaption>` : ""}</figure>`;
  while (i < photos.length) {
    const p = photos[i], q = photos[i + 1], tall = p.h > p.w * 1.05, mode = step % 3;
    if (q && (mode !== 0 || (tall && q.h > q.w))) { out.push(`<div class="row pair">${fig(p, i, 1)}${fig(q, i + 1, 1)}</div>`); i += 2; }
    else if (tall) { out.push(`<div class="row tall ${step % 2 ? "left" : "right"}">${fig(p, i)}</div>`); i++; }
    else if (mode === 0 && step % 2 === 0) { out.push(`<div class="row one">${fig(p, i)}</div>`); i++; }
    else { out.push(`<div class="row ${step % 2 ? "right" : "left"}">${fig(p, i)}</div>`); i++; }
    step++;
  }
  return out.join("");
}

function chapter(id) {
  const i = B.chapters.findIndex(c => c.id === id);
  if (i < 0) return contents();
  const c = B.chapters[i], next = B.chapters[i + 1] || B.chapters[0];
  document.title = `${c.title} · ${B.title || "Our Scrapbook"}`;
  $("toContents").hidden = false;
  const all = c.pages.flatMap(p => p.photos);
  let k = 0;
  const places = c.pages.map((p, j) => { const s = k; k += p.photos.length;
    return `<section class="place wrap" id="place-${j}"><header><h2>${esc(p.heading)}</h2><span class="small mute">${esc(p.sub || "")}</span></header>${p.blurb ? `<p class="blurb">${esc(p.blurb)}</p>` : ""}<div class="rows">${rows(p.photos, s)}</div></section>`; }).join("");
  const hl = c.kind === "trip" && c.pages.length > 1 ? `<div class="wrap"><h2 class="center">Highlights</h2><div class="cards">${c.pages.map((p, j) =>
    card("", p.photos[p.lead || 0].src, p.heading, esc(p.blurb || p.sub || ""), `data-place="${j}"`)).join("")}</div></div>` : "";
  $("app").innerHTML = `<div class="hero"><img src="${esc(c.cover)}" alt=""><div class="top wrap"><h1>${esc(c.title)}</h1></div>`
    + `<div class="bottom wrap"><span class="small">Chapter ${two(i + 1)}&nbsp;&nbsp;|&nbsp;&nbsp;${esc(c.dates || c.when)}${c.places && c.places.length > 1 ? "&nbsp;&nbsp;|&nbsp;&nbsp;" + c.places.map(esc).join(" · ") : ""}</span>${c.intro ? `<p class="line">${esc(c.intro)}</p>` : ""}</div></div>`
    + (hl ? `<div style="height:clamp(56px,8vw,120px)"></div>` + hl : "") + places
    + `<div class="wrap next"><span class="small mute">${B.chapters[i + 1] ? "Next chapter" : "Back to the first chapter"}</span>${card(`#c-${esc(next.id)}`, next.cover, next.title, chapterLine(next))}</div>`;
  $("app").querySelectorAll("figure button").forEach(b => b.onclick = () => openLb(all, +b.dataset.k));
  watchClips();
  $("app").querySelectorAll("button.card").forEach(b => b.onclick = () => $("place-" + b.dataset.place).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}));
}

/* clips play silently while on screen, pause off screen; with reduced motion they wait for a tap */
let clipObs = null;
function watchClips() {
  if (clipObs) clipObs.disconnect();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  clipObs = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; if (!still) v.play().catch(() => {}); }
    else if (!v.paused) v.pause();
  }), {rootMargin: "200px 0px"});
  $("app").querySelectorAll("video[data-src]").forEach(v => clipObs.observe(v));
}

function openLb(list, at) { lbList = list; lbAt = at; lastFocus = document.activeElement; $("lb").hidden = false; showLb(); $("lbClose").focus(); }
function showLb() {
  const p = lbList[lbAt], vid = p.type === "video", V = $("lbVid");
  $("lbImg").hidden = vid; V.hidden = !vid;
  if (vid) { V.src = p.src; V.poster = p.poster || ""; V.muted = false; V.play().catch(() => {}); }
  else { V.pause(); V.removeAttribute("src"); $("lbImg").src = p.src; $("lbImg").alt = p.caption || ""; }
  $("lbCap").textContent = p.caption || ""; $("lbCount").textContent = `${two(lbAt + 1)} / ${two(lbList.length)}${p.date ? "  ·  " + p.date : ""}`;
  $("lbPrev").disabled = lbAt === 0; $("lbNext").disabled = lbAt === lbList.length - 1;
}
function closeLb() { $("lbVid").pause(); $("lb").hidden = true; lastFocus && lastFocus.focus && lastFocus.focus(); }
$("lbPrev").onclick = () => { if (lbAt > 0) { lbAt--; showLb(); } };
$("lbNext").onclick = () => { if (lbAt < lbList.length - 1) { lbAt++; showLb(); } };
$("lbClose").onclick = closeLb;
$("lb").addEventListener("click", e => { if (e.target === $("lb")) closeLb(); });
document.addEventListener("keydown", e => {
  if ($("lb").hidden) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") $("lbPrev").click();
  if (e.key === "ArrowRight") $("lbNext").click();
});

function route() {
  if (!B) return;
  $("lb").hidden = true;
  const h = location.hash.slice(1);
  if (h.startsWith("c-")) chapter(h.slice(2)); else contents();
  scrollTo(0, 0);
}
addEventListener("hashchange", route);
["toContents", "barName"].forEach(id => $(id).onclick = e => { e.preventDefault(); location.hash = ""; route(); });

fetch("data.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(d => { B = d; $("barName").textContent = d.title || "Our Scrapbook"; route(); }).catch(() => {
  $("app").innerHTML = `<div class="wrap empty"><span class="small mute">Nothing here yet</span><h1>Our Scrapbook</h1><p>The photos for this scrapbook haven't been added yet. On the Mac, run scripts/scrapbook.py, then publish the folder it makes.</p></div>`;
});
})();
</script>
